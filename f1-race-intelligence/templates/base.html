<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}F1 Race Intelligence{% endblock %}</title>
  <meta name="description" content="Interactive Tableau analysis of Formula 1 races, drivers and teams from 2010 to 2026.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e10600'/%3E%3Cpath d='M5 24 13 8h4L9 24zM13 24l8-16h4l-8 16z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>F1 Race <span class="brand-accent">Intelligence</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        {% for endpoint, label in [("home", "Home"), ("dashboard", "Dashboard"), ("story", "Story")] %}
        <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="checker" aria-hidden="true"></div>
    <div class="wrap">
      <span>Formula 1 Race Intelligence · 2010 to 2026</span>
      <span>Built with Tableau Public and Flask</span>
    </div>
  </footer>
</body>
</html>
